{% extends 'jobs/base.html' %}
{% block title %}Login — Job Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-briefcase-fill"></i>
    </div>
    <h1>Job Tracker</h1>
    <p class="auth-subtitle">Track your job applications smartly</p>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Enter username">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter password">
    </div>
    <button class="btn btn-primary w-100 btn-lg" onclick="login()">
      <i class="bi bi-box-arrow-in-right"></i> Login
    </button>
      <p class="mt-3 text-center">Don't have an account? <a href="/register/">Register here</a></p>
      <p class="mt-1 text-center"><a href="/reset-password/">Forgot Password?</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function login() {
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');

  try {
    const response = await fetch('/api/auth/login/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await response.json();
    if (response.ok) {
      localStorage.setItem('access_token', data.access);
      localStorage.setItem('refresh_token', data.refresh);
      localStorage.setItem('username', username);
      window.location.href = '/dashboard/';
    } else {
      errorMsg.classList.remove('d-none');
      errorMsg.textContent = 'Invalid username or password!';
    }
  } catch (err) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Something went wrong. Try again.';
  }
}

document.addEventListener('keypress', function(e) {
  if (e.key === 'Enter') login();
});
</script>
{% endblock %}
