{% extends 'jobs/base.html' %}
{% block title %}Reset Password — Job Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-key-fill"></i>
    </div>
    <h1>Reset Password</h1>
    <p class="auth-subtitle">Enter your username and new password</p>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div id="success-msg" class="alert alert-success d-none"></div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Enter your username">
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" id="new_password" class="form-control" placeholder="Enter new password">
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" id="confirm_password" class="form-control" placeholder="Confirm new password">
    </div>
    <button class="btn btn-primary w-100 btn-lg" onclick="resetPassword()">
      <i class="bi bi-check-circle"></i> Reset Password
    </button>
    <p class="mt-3 text-center"><a href="/">Back to Login</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function resetPassword() {
  const username = document.getElementById('username').value;
  const new_password = document.getElementById('new_password').value;
  const confirm_password = document.getElementById('confirm_password').value;
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  errorMsg.classList.add('d-none');
  successMsg.classList.add('d-none');

  if (!username || !new_password) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Please fill in all fields!';
    return;
  }

  if (new_password !== confirm_password) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Passwords do not match!';
    return;
  }

  if (new_password.length < 6) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Password must be at least 6 characters!';
    return;
  }

  try {
    const response = await fetch('/api/auth/reset-password/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, new_password })
    });
    const data = await response.json();
    if (response.ok) {
      successMsg.classList.remove('d-none');
      successMsg.textContent = 'Password reset successful! Redirecting to login...';
      setTimeout(() => window.location.href = '/', 2000);
    } else {
      errorMsg.classList.remove('d-none');
      errorMsg.textContent = data.error || 'Something went wrong!';
    }
  } catch (err) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Something went wrong. Try again.';
  }
}
</script>
{% endblock %}
