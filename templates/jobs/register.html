{% extends 'jobs/base.html' %}
{% block title %}Register — Job Tracker{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="bi bi-briefcase-fill"></i>
    </div>
    <h1>Create Account</h1>
    <p class="auth-subtitle">Start tracking your job applications</p>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div id="success-msg" class="alert alert-success d-none"></div>
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" id="username" class="form-control" placeholder="Choose a username">
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" id="email" class="form-control" placeholder="Your email">
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Choose a password">
    </div>
    <button class="btn btn-primary w-100 btn-lg" onclick="register()">
      <i class="bi bi-person-plus"></i> Register
    </button>
    <p class="mt-3 text-center">Already have an account? <a href="/">Login here</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function register() {
  const username = document.getElementById('username').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  try {
    const response = await fetch('/api/auth/register/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await response.json();
    if (response.ok) {
      successMsg.classList.remove('d-none');
      successMsg.textContent = 'Account created! Redirecting to login...';
      setTimeout(() => window.location.href = '/', 1500);
    } else {
      errorMsg.classList.remove('d-none');
      errorMsg.textContent = data.username ? data.username[0] : 'Registration failed!';
    }
  } catch (err) {
    errorMsg.classList.remove('d-none');
    errorMsg.textContent = 'Something went wrong. Try again.';
  }
}
</script>
{% endblock %}
